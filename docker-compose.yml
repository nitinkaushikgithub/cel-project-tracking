services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Auth.js v5 refuses to start in production without this (session/JWT
      # signing key) — generate one with `openssl rand -base64 32` and put
      # it in .env, never commit a real value. See .env.example.
      AUTH_SECRET: ${AUTH_SECRET}
      # Reverse-proxied behind Caddy on an internal hostname that isn't
      # fixed yet (CLAUDE.md §9.10 — DNS name still open). Without this,
      # Auth.js v5 rejects requests whose Host header it doesn't recognize.
      AUTH_TRUST_HOST: "true"
      # Phase 3 — email alerts (CLAUDE.md §8.2: "SMTP server details and
      # credentials... without this the email alerts cannot be sent").
      # Leaving SMTP_HOST unset in .env is fine — the app runs and Alert
      # rows still get created, sending just logs instead. See
      # src/lib/email.ts and .env.example.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
      # Optional — see .env.example. Unset means the seed script generates
      # a random admin password on first creation and logs it once.
      SEED_ADMIN_LOGIN_NAME: ${SEED_ADMIN_LOGIN_NAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TLS strategy is open (CLAUDE.md §9.10 / source doc §8.1, Q11: internal CA
  # vs self-signed vs plain HTTP — not yet answered by the customer). Caddy
  # currently serves plain HTTP on the internal network only, as a
  # placeholder. See Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
